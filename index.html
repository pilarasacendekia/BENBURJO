<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Kasir Warkop</title>
<style>
  :root{
    --bg:#241A14;
    --surface:#2F241C;
    --surface-2:#3B2C22;
    --line:#4A3A2C;
    --cream:#F2E8D5;
    --muted:#B3A088;
    --red:#C13B2A;
    --red-dim:#8f2c1f;
    --yellow:#E0A83E;
    --green:#7CA166;
    --green-dim:#4f6b41;
    --font-display: Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-num: 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:var(--font-body);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  header{
    padding:16px 16px 12px;
    background:linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .header-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .kedai-name{
    font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:0.3px;
    display:flex; align-items:center; gap:8px; cursor:pointer;
  }
  .kedai-name .edit-icon{opacity:0.5; font-size:13px;}
  .today-date{font-size:11px; color:var(--muted); margin-top:2px; text-transform:capitalize;}
  .omzet-badge{ text-align:right; }
  .omzet-badge .label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
  .omzet-badge .value{font-family:var(--font-num); font-size:17px; font-weight:700; color:var(--yellow);}

  main{ flex:1; overflow-y:auto; padding:14px 14px 12px; -webkit-overflow-scrolling:touch; }
  .view{display:none;}
  .view.active{display:block;}

  h2.section-title{
    font-family:var(--font-display); font-size:15px; color:var(--muted);
    text-transform:uppercase; letter-spacing:1px; margin:0 0 10px;
    display:flex; justify-content:space-between; align-items:center;
  }
  h2.section-title button.link{
    font-family:var(--font-body); background:none; border:none; color:var(--yellow);
    font-size:12px; letter-spacing:0; text-transform:none; padding:4px; cursor:pointer;
  }

  .menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .menu-btn{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:14px 10px; text-align:left; color:var(--cream); cursor:pointer;
    transition:transform 0.08s ease, background 0.15s ease; position:relative;
  }
  .menu-btn:active{transform:scale(0.96); background:var(--surface-2);}
  .menu-btn .m-name{font-size:14px; font-weight:600; line-height:1.25;}
  .menu-btn .m-price{font-family:var(--font-num); font-size:13px; color:var(--yellow); margin-top:6px;}
  .menu-btn .m-qty{
    position:absolute; top:-6px; right:-6px; background:var(--red); color:#fff;
    font-family:var(--font-num); font-weight:700; font-size:12px;
    min-width:22px; height:22px; border-radius:11px;
    display:flex; align-items:center; justify-content:center; padding:0 5px;
  }

  .cart-box{ background:var(--surface); border:1px dashed var(--line); border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .cart-empty{color:var(--muted); font-size:13px; text-align:center; padding:10px 0;}
  .cart-row{ display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .cart-row:last-child{border-bottom:none;}
  .cart-row .ci-name{flex:1; padding-right:8px;}
  .cart-row .ci-sub{font-family:var(--font-num); color:var(--muted); font-size:11px;}
  .qty-stepper{display:flex; align-items:center; gap:8px;}
  .qty-stepper button{
    width:24px; height:24px; border-radius:6px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--cream); font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .qty-stepper .qn{font-family:var(--font-num); min-width:16px; text-align:center;}
  .cart-total-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding-top:8px; margin-top:4px; border-top:1px solid var(--line);
    font-family:var(--font-num); font-weight:700; font-size:16px;
  }

  .btn{
    display:block; width:100%; text-align:center; padding:13px; border-radius:10px; border:none;
    font-family:var(--font-body); font-weight:700; font-size:14.5px; cursor:pointer; letter-spacing:0.2px;
  }
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:active{background:var(--red-dim);}
  .btn-primary:disabled{background:var(--surface-2); color:var(--muted); cursor:not-allowed;}
  .btn-ghost{background:var(--surface-2); color:var(--cream); border:1px solid var(--line);}

  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .field input, .field select{
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--cream); font-family:var(--font-body); font-size:14.5px;
  }
  .field input:focus, .field select:focus{outline:1px solid var(--yellow);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .log-card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .log-item{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .log-item:last-child{border-bottom:none;}
  .log-item .li-main{flex:1;}
  .log-item .li-sub{font-size:11px; color:var(--muted);}
  .log-item .li-amt{font-family:var(--font-num); color:var(--yellow); font-weight:600;}
  .log-item .li-del{background:none;border:none;color:var(--muted);font-size:16px;padding:4px 6px;cursor:pointer;}
  .empty-note{color:var(--muted); font-size:12.5px; text-align:center; padding:14px 0;}

  .segmented{ display:flex; background:var(--surface); border-radius:9px; padding:3px; border:1px solid var(--line); margin-bottom:14px; }
  .segmented button{ flex:1; background:none; border:none; color:var(--muted); padding:8px 6px; font-size:12.5px; font-weight:600; border-radius:7px; cursor:pointer; }
  .segmented button.active{background:var(--red); color:#fff;}

  .recap-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .recap-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px;}
  .recap-card .rc-label{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;}
  .recap-card .rc-val{font-family:var(--font-num); font-size:17px; font-weight:700; margin-top:4px;}
  .recap-card.full{grid-column:1 / -1;}
  .recap-card.laba .rc-val.pos{color:var(--green);}
  .recap-card.laba .rc-val.neg{color:var(--red);}

  .tally-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .tally-row:last-child{border-bottom:none;}
  .tally-row .t-count{font-family:var(--font-num); color:var(--yellow); font-weight:700;}

  nav.tabbar{
    display:flex; flex-shrink:0; background:var(--surface); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--muted); padding:10px 4px 8px;
    font-family:var(--font-body); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav.tabbar button .ic{font-size:19px;}
  nav.tabbar button .lb{font-size:10.5px; font-weight:600; letter-spacing:0.2px;}
  nav.tabbar button.active{color:var(--yellow);}

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-overlay.open{display:flex;}
  .modal-sheet{
    background:var(--surface); width:100%; max-width:480px; border-radius:16px 16px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom,0)); max-height:85vh; overflow-y:auto;
    animation:slideUp 0.2s ease;
  }
  @keyframes slideUp{from{transform:translateY(20px); opacity:0.6;} to{transform:translateY(0); opacity:1;}}
  .modal-title{font-family:var(--font-display); font-size:17px; font-weight:700; margin:0 0 14px; display:flex; justify-content:space-between; align-items:center;}
  .modal-title .close{background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; line-height:1;}
  .kembalian-box{ text-align:center; padding:16px; background:var(--surface-2); border-radius:10px; margin:14px 0; }
  .kembalian-box .kb-label{font-size:11px; color:var(--muted); text-transform:uppercase;}
  .kembalian-box .kb-val{font-family:var(--font-num); font-size:26px; font-weight:700; margin-top:4px;}
  .kembalian-box .kb-val.neg{color:var(--red);}
  .kembalian-box .kb-val.pos{color:var(--green);}

  .menu-edit-row{display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line);}
  .menu-edit-row input{flex:1;}
  .menu-edit-row input.price{max-width:100px;}
  .menu-edit-row .del{background:none; border:none; color:var(--red); font-size:18px; cursor:pointer; padding:4px;}

  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    background:var(--green-dim); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13px; font-weight:600; z-index:60; opacity:0; pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="kedai-name" id="kedaiNameDisplay">
        <span id="kedaiNameText">Warkop Saya</span><span class="edit-icon">✎</span>
      </div>
      <div class="today-date" id="todayDate"></div>
    </div>
    <div class="omzet-badge">
      <div class="label">Omzet Hari Ini</div>
      <div class="value" id="omzetTodayHeader">Rp0</div>
    </div>
  </div>
</header>

<main>
  <!-- KASIR -->
  <section class="view active" id="view-kasir">
    <h2 class="section-title">Menu <button class="link" id="btnKelolaMenu">Kelola Menu</button></h2>
    <div class="menu-grid" id="menuGrid"></div>

    <h2 class="section-title">Pesanan</h2>
    <div class="cart-box" id="cartBox">
      <div class="cart-empty">Belum ada pesanan. Tap menu di atas.</div>
    </div>
    <button class="btn btn-primary" id="btnBayar" disabled>Bayar</button>
  </section>

  <!-- STOK -->
  <section class="view" id="view-stok">
    <h2 class="section-title">Belanja Bahan</h2>
    <div class="log-card">
      <div class="field">
        <label>Nama Bahan</label>
        <input type="text" id="stokNama" placeholder="Contoh: Indomie Goreng, Telur, Gula">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Jumlah</label>
          <input type="number" id="stokJumlah" placeholder="0" inputmode="decimal" step="any">
        </div>
        <div class="field">
          <label>Satuan</label>
          <select id="stokSatuan">
            <option>pcs</option><option>gram</option><option>ml</option><option>kg</option><option>liter</option><option>dus</option><option>pack</option><option>botol</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Total Harga Beli (Rp)</label>
        <input type="number" id="stokHarga" placeholder="0" inputmode="numeric">
      </div>
      <button class="btn btn-primary" id="btnSimpanStok">Simpan Belanja</button>
    </div>
    <div id="stokListWrap"></div>

    <h2 class="section-title" style="margin-top:20px;">Biaya Operasional</h2>
    <div class="log-card">
      <div class="field">
        <label>Keterangan</label>
        <input type="text" id="biayaKet" placeholder="Contoh: Listrik, Gas, Sewa, Gaji">
      </div>
      <div class="field">
        <label>Jumlah (Rp)</label>
        <input type="number" id="biayaJumlah" placeholder="0" inputmode="numeric">
      </div>
      <button class="btn btn-primary" id="btnSimpanBiaya">Simpan Biaya</button>
    </div>
    <div id="biayaListWrap"></div>
  </section>

  <!-- REKAP -->
  <section class="view" id="view-rekap">
    <div class="segmented" id="rekapSegmented">
      <button data-range="today" class="active">Hari Ini</button>
      <button data-range="week">7 Hari</button>
      <button data-range="all">Semua</button>
    </div>

    <div class="recap-grid">
      <div class="recap-card"><div class="rc-label">Omzet</div><div class="rc-val" id="rcOmzet">Rp0</div></div>
      <div class="recap-card"><div class="rc-label">Transaksi</div><div class="rc-val" id="rcTrans">0</div></div>
      <div class="recap-card"><div class="rc-label">Belanja Bahan</div><div class="rc-val" id="rcBelanja">Rp0</div></div>
      <div class="recap-card"><div class="rc-label">Biaya Operasional</div><div class="rc-val" id="rcBiaya">Rp0</div></div>
      <div class="recap-card laba full"><div class="rc-label">Laba Bersih</div><div class="rc-val" id="rcLaba">Rp0</div></div>
    </div>

    <h2 class="section-title">Item Terlaris</h2>
    <div class="log-card" id="terlarisWrap"></div>

    <h2 class="section-title" style="margin-top:18px;">Riwayat Transaksi</h2>
    <div class="log-card" id="riwayatWrap"></div>
  </section>
</main>

<nav class="tabbar">
  <button class="tab-btn active" data-view="kasir"><span class="ic">🍜</span><span class="lb">Kasir</span></button>
  <button class="tab-btn" data-view="stok"><span class="ic">📦</span><span class="lb">Stok</span></button>
  <button class="tab-btn" data-view="rekap"><span class="ic">📊</span><span class="lb">Rekap</span></button>
</nav>

<!-- Modal: Bayar -->
<div class="modal-overlay" id="modalBayar">
  <div class="modal-sheet">
    <div class="modal-title">Bayar <button class="close" data-close="modalBayar">×</button></div>
    <div class="field">
      <label>Total Belanja</label>
      <input type="text" id="bayarTotalDisplay" disabled style="font-family:var(--font-num); font-weight:700; font-size:17px;">
    </div>
    <div class="field">
      <label>Uang Diterima</label>
      <input type="number" id="bayarUangDiterima" placeholder="0" inputmode="numeric">
    </div>
    <div class="kembalian-box">
      <div class="kb-label">Kembalian</div>
      <div class="kb-val" id="kembalianVal">Rp0</div>
    </div>
    <button class="btn btn-primary" id="btnSelesaiBayar">Selesai & Catat</button>
  </div>
</div>

<!-- Modal: Kelola Menu -->
<div class="modal-overlay" id="modalMenu">
  <div class="modal-sheet">
    <div class="modal-title">Kelola Menu <button class="close" data-close="modalMenu">×</button></div>
    <div id="menuEditList"></div>
    <div class="field-row" style="margin-top:14px;">
      <div class="field"><label>Nama Menu Baru</label><input type="text" id="newMenuNama" placeholder="Nama"></div>
      <div class="field" style="max-width:110px;"><label>Harga</label><input type="number" id="newMenuHarga" placeholder="0"></div>
    </div>
    <button class="btn btn-ghost" id="btnTambahMenu">+ Tambah Menu</button>
  </div>
</div>

<!-- Modal: Edit Nama Kedai -->
<div class="modal-overlay" id="modalNama">
  <div class="modal-sheet">
    <div class="modal-title">Nama Kedai <button class="close" data-close="modalNama">×</button></div>
    <div class="field"><input type="text" id="inputKedaiNama" placeholder="Warkop Saya"></div>
    <button class="btn btn-primary" id="btnSimpanNama">Simpan</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  // GANTI URL DI BAWAH INI dengan Web App URL hasil deploy Apps Script kamu
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwMdlFMA-D_FXhBPhI8TfFtx5cIDZayoxlvNl-w_YzFqb5AomOaCQowkgbdic9PQym0-g/exec';

  const DEFAULT_DATA = {
    settings: { name: 'BEN BURJO', menuFinalV1: false, nameFixV1: false },
    menu: [
      {id:'m1',  name:'Bubur Kacang Hijau', price:8000},
      {id:'m2',  name:'Bubur Kacang Ketan Hitam', price:12000},
      {id:'m3',  name:'Es Jeruk', price:10000},
      {id:'m4',  name:'Good Day Cappucino', price:7000},
      {id:'m5',  name:'Good Day Freeze', price:8000},
      {id:'m6',  name:'Indomie Goreng', price:8000},
      {id:'m7',  name:'Indomie Goreng + Telur', price:12000},
      {id:'m8',  name:'Indomie Kuah', price:8000},
      {id:'m9',  name:'Indomie Kuah + Telur', price:12000},
      {id:'m10', name:'Jeniper', price:10000},
      {id:'m11', name:'Kentang Goreng', price:12000},
      {id:'m12', name:'Kopi Item', price:4000},
      {id:'m13', name:'Milo', price:8000},
      {id:'m14', name:'Nutrisari', price:7000},
      {id:'m15', name:'Ovomaltine', price:8000},
      {id:'m16', name:'Pancong Cokelat', price:12000},
      {id:'m17', name:'Pancong Cokelat Keju', price:12000},
      {id:'m18', name:'Pancong Crumble Caramel', price:12000},
      {id:'m19', name:'Pancong Keju', price:12000},
      {id:'m20', name:'Pancong Matcha', price:12000},
      {id:'m21', name:'Pancong Original', price:8000},
      {id:'m22', name:'Teh Manis', price:5000},
      {id:'m23', name:'Teh Tarik', price:7000},
    ],
    transactions: [],
    stockLogs: [],
    costLogs: [],
  };

  let data = null;
  let cart = {}; // menuId -> {qty, name, price}

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function rupiah(n){ return 'Rp' + Math.round(n).toLocaleString('id-ID'); }
  function numFmt(n){
    const rounded = Math.round((n + Number.EPSILON) * 100) / 100;
    return rounded.toLocaleString('id-ID', { maximumFractionDigits: 2 });
  }
  function todayKey(d){ d = d || new Date(); return d.toISOString().slice(0,10); }
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1600);
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  // ===== Backend: Google Apps Script, tanpa fetch() sama sekali =====
  // GET lewat JSONP (tag <script>), POST lewat form submission ke iframe tersembunyi.
  // Ini menghindari batasan CORS/CSP yang suka mengunci fetch()/XHR ke domain luar.
  let jsonpCounter = 0;
  function jsonpRequest(url){
    return new Promise((resolve, reject)=>{
      const cbName = 'wk_cb_' + (jsonpCounter++) + '_' + Date.now();
      const script = document.createElement('script');
      let settled = false;
      const cleanup = ()=>{
        delete window[cbName];
        if(script.parentNode) script.parentNode.removeChild(script);
      };
      window[cbName] = (payload)=>{ settled = true; cleanup(); resolve(payload); };
      script.onerror = ()=>{ if(!settled){ settled = true; cleanup(); reject(new Error('JSONP gagal dimuat')); } };
      const sep = url.indexOf('?') === -1 ? '?' : '&';
      script.src = url + sep + 'callback=' + cbName + '&_=' + Date.now();
      document.head.appendChild(script);
      setTimeout(()=>{ if(!settled){ settled = true; cleanup(); reject(new Error('JSONP timeout')); } }, 6000);
    });
  }
  async function backendGet(){
    return await jsonpRequest(WEBAPP_URL);
  }

  // Simpan data lewat JSONP juga (GET dengan action=set), bukan form submission —
  // supaya kita BENERAN TAU apakah tersimpan atau nggak, bukan kirim-dan-berharap.
  async function backendSet(dataObj){
    const encoded = encodeURIComponent(JSON.stringify(dataObj));
    const url = WEBAPP_URL + '?action=set&data=' + encoded;
    const result = await jsonpRequest(url);
    if(!result || result.ok !== true){
      throw new Error('Server menolak simpan data');
    }
  }

  function backfillData(d){
    d.settings = d.settings || {name:'Warkop Saya'};
    d.menu = d.menu || DEFAULT_DATA.menu;
    d.transactions = d.transactions || [];
    d.stockLogs = d.stockLogs || [];
    d.costLogs = d.costLogs || [];
    return d;
  }

  // Migrasi satu-kali: ganti daftar menu ke daftar final yang benar, dan buang
  // sisa-sisa data resep/bahan dari versi lama (kalau ada). Cuma jalan sekali,
  // transaksi/belanja/biaya yang sudah tercatat TETAP AMAN, nggak kehapus.
  function ensureFinalMenuV1(){
    if(data.settings.menuFinalV1) return false;
    data.menu = JSON.parse(JSON.stringify(DEFAULT_DATA.menu)).map(m=>({ id:'m'+uid(), name:m.name, price:m.price }));
    delete data.ingredients;
    data.settings.menuFinalV1 = true;
    return true;
  }

  // Migrasi satu-kali: paksa ganti nama kedai jadi "BEN BURJO", walaupun
  // sebelumnya sudah ada nama lain tersimpan dari data lama.
  function ensureNameFix(){
    if(data.settings.nameFixV1) return false;
    data.settings.name = 'BEN BURJO';
    data.settings.nameFixV1 = true;
    return true;
  }

  async function loadData(){
    document.getElementById('menuGrid').innerHTML = '<div class="empty-note" style="grid-column:1/-1;">Memuat menu...</div>';
    try{
      const raw = await backendGet();
      if(raw && Object.keys(raw).length > 0){
        data = backfillData(raw);
      } else {
        data = backfillData(JSON.parse(JSON.stringify(DEFAULT_DATA)));
        await saveData();
      }
    }catch(e){
      // Kalau backend lambat/gagal, JANGAN nunggu lama-lama — langsung pakai
      // data default (yang isinya udah sama kayak menu asli) biar kasir tetap
      // bisa jalan. Auto-refresh tiap 7 detik nanti otomatis nyambungin ke data
      // asli begitu backend-nya siap, tanpa perlu buka ulang halaman.
      console.error('Gagal ambil data, pakai data sementara dulu', e);
      data = backfillData(JSON.parse(JSON.stringify(DEFAULT_DATA)));
      toast('Server lambat merespons, pakai menu sementara — nanti nyambung otomatis');
    }
    let needSave = false;
    if(ensureFinalMenuV1()) needSave = true;
    if(ensureNameFix()) needSave = true;
    if(needSave){
      try{ await saveData(); }catch(e){ console.error('Gagal simpan hasil migrasi', e); }
    }
    renderAll();
  }

  async function saveData(){
    try{ await backendSet(data); }
    catch(e){ console.error('Storage error', e); toast('Gagal menyimpan data'); }
  }

  async function fetchLatest(){
    try{
      const raw = await backendGet();
      if(raw && Object.keys(raw).length > 0){ data = backfillData(raw); }
    }catch(e){
      console.error('fetchLatest gagal, pakai data lokal', e);
    }
  }

  function renderReadOnly(){
    document.getElementById('kedaiNameText').textContent = data.settings.name;
    renderMenuGrid();
    renderHeaderOmzet();
    renderStokLists();
    renderRekap();
  }

  // ===== Tabs =====
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-'+btn.dataset.view).classList.add('active');
      if(btn.dataset.view === 'rekap') renderRekap();
      if(btn.dataset.view === 'stok') renderStokLists();
    });
  });

  // ===== Modals =====
  function openModal(id){ document.getElementById(id).classList.add('open'); }
  function closeModal(id){ document.getElementById(id).classList.remove('open'); }
  document.querySelectorAll('[data-close]').forEach(b=>{
    b.addEventListener('click', ()=>closeModal(b.dataset.close));
  });
  document.querySelectorAll('.modal-overlay').forEach(ov=>{
    ov.addEventListener('click', (e)=>{ if(e.target===ov) ov.classList.remove('open'); });
  });

  // ===== Kedai name =====
  document.getElementById('kedaiNameDisplay').addEventListener('click', ()=>{
    document.getElementById('inputKedaiNama').value = data.settings.name;
    openModal('modalNama');
  });
  document.getElementById('btnSimpanNama').addEventListener('click', async ()=>{
    const v = document.getElementById('inputKedaiNama').value.trim();
    if(v){
      await fetchLatest();
      data.settings.name = v;
      document.getElementById('kedaiNameText').textContent = v;
      await saveData();
    }
    closeModal('modalNama');
  });

  // ===== Render Menu Grid =====
  function renderMenuGrid(){
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';
    const sortedMenu = [...data.menu].sort((a,b)=>a.name.localeCompare(b.name, 'id'));
    sortedMenu.forEach(item=>{
      const btn = document.createElement('button');
      btn.className = 'menu-btn';
      const qty = cart[item.id] ? cart[item.id].qty : 0;
      btn.innerHTML = `<div class="m-name">${escapeHtml(item.name)}</div><div class="m-price">${rupiah(item.price)}</div>` + (qty>0 ? `<div class="m-qty">${qty}</div>` : '');
      btn.addEventListener('click', ()=>{
        if(cart[item.id]) cart[item.id].qty += 1;
        else cart[item.id] = { qty: 1, name: item.name, price: item.price };
        renderMenuGrid(); renderCart();
      });
      grid.appendChild(btn);
    });
  }

  function renderCart(){
    const box = document.getElementById('cartBox');
    const ids = Object.keys(cart).filter(k=>cart[k] && cart[k].qty>0);
    if(ids.length === 0){
      box.innerHTML = '<div class="cart-empty">Belum ada pesanan. Tap menu di atas.</div>';
      document.getElementById('btnBayar').disabled = true;
      return;
    }
    let total = 0;
    let html = '';
    ids.forEach(id=>{
      const c = cart[id];
      const sub = c.price * c.qty;
      total += sub;
      html += `<div class="cart-row">
        <div class="ci-name">${escapeHtml(c.name)}<div class="ci-sub">${rupiah(c.price)} x ${c.qty} = ${rupiah(sub)}</div></div>
        <div class="qty-stepper">
          <button data-act="minus" data-id="${id}">−</button>
          <span class="qn">${c.qty}</span>
          <button data-act="plus" data-id="${id}">+</button>
        </div>
      </div>`;
    });
    html += `<div class="cart-total-row"><span>Total</span><span>${rupiah(total)}</span></div>`;
    box.innerHTML = html;
    box.querySelectorAll('button[data-act]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const id = b.dataset.id;
        if(b.dataset.act==='plus') cart[id].qty += 1;
        else { cart[id].qty -= 1; if(cart[id].qty<=0) delete cart[id]; }
        renderMenuGrid(); renderCart();
      });
    });
    document.getElementById('btnBayar').disabled = false;
  }

  function cartTotal(){
    let total = 0;
    Object.values(cart).forEach(c=>{ total += c.price * c.qty; });
    return total;
  }

  // ===== Bayar flow =====
  document.getElementById('btnBayar').addEventListener('click', ()=>{
    const total = cartTotal();
    document.getElementById('bayarTotalDisplay').value = rupiah(total);
    document.getElementById('bayarUangDiterima').value = '';
    updateKembalian();
    openModal('modalBayar');
    setTimeout(()=>document.getElementById('bayarUangDiterima').focus(), 200);
  });
  document.getElementById('bayarUangDiterima').addEventListener('input', updateKembalian);
  function updateKembalian(){
    const total = cartTotal();
    const diterima = parseFloat(document.getElementById('bayarUangDiterima').value) || 0;
    const kembali = diterima - total;
    const el = document.getElementById('kembalianVal');
    el.textContent = rupiah(Math.abs(kembali));
    el.className = 'kb-val ' + (kembali<0 ? 'neg' : 'pos');
  }
  document.getElementById('btnSelesaiBayar').addEventListener('click', async ()=>{
    const total = cartTotal();
    if(total<=0) return;
    const diterima = parseFloat(document.getElementById('bayarUangDiterima').value) || 0;
    const items = Object.keys(cart).map(id=>{
      const c = cart[id];
      return { id, name: c.name, price: c.price, qty: c.qty };
    });
    const newTx = {
      id: uid(), time: new Date().toISOString(),
      items, total, cashReceived: diterima, change: diterima-total
    };
    await fetchLatest();
    data.transactions.push(newTx);
    await saveData();
    cart = {};
    renderMenuGrid(); renderCart(); renderHeaderOmzet(); renderStokLists(); renderRekap();
    closeModal('modalBayar');
    toast('Transaksi tersimpan');
  });

  // ===== Kelola Menu =====
  document.getElementById('btnKelolaMenu').addEventListener('click', ()=>{ renderMenuEditList(); openModal('modalMenu'); });
  function renderMenuEditList(){
    const wrap = document.getElementById('menuEditList');
    wrap.innerHTML = '';
    const sortedMenu = [...data.menu].sort((a,b)=>a.name.localeCompare(b.name, 'id'));
    sortedMenu.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'menu-edit-row';
      row.innerHTML = `<input type="text" value="${escapeAttr(item.name)}" data-field="name" data-id="${item.id}">
        <input type="number" class="price" value="${item.price}" data-field="price" data-id="${item.id}">
        <button class="del" data-del="${item.id}">🗑</button>`;
      wrap.appendChild(row);
    });
    wrap.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const targetId = inp.dataset.id;
        const field = inp.dataset.field;
        const val = inp.value;
        await fetchLatest();
        const item = data.menu.find(m=>m.id===targetId);
        if(!item) return;
        if(field==='name') item.name = val.trim() || item.name;
        else item.price = parseFloat(val) || 0;
        await saveData();
        renderMenuGrid();
      });
    });
    wrap.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const targetId = b.dataset.del;
        await fetchLatest();
        data.menu = data.menu.filter(m=>m.id!==targetId);
        delete cart[targetId];
        await saveData();
        renderMenuEditList(); renderMenuGrid(); renderCart();
      });
    });
  }
  document.getElementById('btnTambahMenu').addEventListener('click', async ()=>{
    const nama = document.getElementById('newMenuNama').value.trim();
    const harga = parseFloat(document.getElementById('newMenuHarga').value) || 0;
    if(!nama){ toast('Isi nama menu dulu'); return; }
    await fetchLatest();
    data.menu.push({id:'m'+uid(), name:nama, price:harga});
    await saveData();
    document.getElementById('newMenuNama').value=''; document.getElementById('newMenuHarga').value='';
    renderMenuEditList(); renderMenuGrid();
  });

  // ===== Stok: Belanja Bahan (sederhana, tanpa lacak sisa stok) =====
  document.getElementById('btnSimpanStok').addEventListener('click', async ()=>{
    const nama = document.getElementById('stokNama').value.trim();
    const jumlah = parseFloat(document.getElementById('stokJumlah').value) || 0;
    const satuan = document.getElementById('stokSatuan').value;
    const harga = parseFloat(document.getElementById('stokHarga').value) || 0;
    if(!nama || harga<=0){ toast('Isi nama bahan & harga dulu'); return; }
    const entry = { id: uid(), time: new Date().toISOString(), name: nama, qty: jumlah, unit: satuan, cost: harga };
    await fetchLatest();
    data.stockLogs.push(entry);
    await saveData();
    document.getElementById('stokNama').value=''; document.getElementById('stokJumlah').value=''; document.getElementById('stokHarga').value='';
    renderStokLists();
    toast('Belanja bahan tersimpan');
  });

  document.getElementById('btnSimpanBiaya').addEventListener('click', async ()=>{
    const ket = document.getElementById('biayaKet').value.trim();
    const jumlah = parseFloat(document.getElementById('biayaJumlah').value) || 0;
    if(!ket || jumlah<=0){ toast('Isi keterangan & jumlah dulu'); return; }
    const entry = { id: uid(), time: new Date().toISOString(), desc: ket, amount: jumlah };
    await fetchLatest();
    data.costLogs.push(entry);
    await saveData();
    document.getElementById('biayaKet').value=''; document.getElementById('biayaJumlah').value='';
    renderStokLists();
    toast('Biaya operasional tersimpan');
  });

  function renderStokLists(){
    const tKey = todayKey();
    const stokToday = data.stockLogs.filter(s=>todayKey(new Date(s.time))===tKey).sort((a,b)=>b.time.localeCompare(a.time));
    const stokWrap = document.getElementById('stokListWrap');
    if(stokToday.length===0){
      stokWrap.innerHTML = '<div class="empty-note">Belum ada belanja bahan hari ini.</div>';
    } else {
      stokWrap.innerHTML = '<div class="log-card">' + stokToday.map(s=>`
        <div class="log-item">
          <div class="li-main">${escapeHtml(s.name)}<div class="li-sub">${s.qty>0? numFmt(s.qty)+' '+s.unit+' · ':''}${timeStr(s.time)}</div></div>
          <div class="li-amt">${rupiah(s.cost)}</div>
          <button class="li-del" data-del-stok="${s.id}">×</button>
        </div>`).join('') + '</div>';
      stokWrap.querySelectorAll('[data-del-stok]').forEach(b=>{
        b.addEventListener('click', async ()=>{
          const targetId = b.dataset.delStok;
          await fetchLatest();
          data.stockLogs = data.stockLogs.filter(x=>x.id!==targetId);
          await saveData(); renderStokLists();
        });
      });
    }

    const biayaToday = data.costLogs.filter(s=>todayKey(new Date(s.time))===tKey).sort((a,b)=>b.time.localeCompare(a.time));
    const biayaWrap = document.getElementById('biayaListWrap');
    if(biayaToday.length===0){
      biayaWrap.innerHTML = '<div class="empty-note">Belum ada biaya operasional hari ini.</div>';
    } else {
      biayaWrap.innerHTML = '<div class="log-card">' + biayaToday.map(s=>`
        <div class="log-item">
          <div class="li-main">${escapeHtml(s.desc)}<div class="li-sub">${timeStr(s.time)}</div></div>
          <div class="li-amt">${rupiah(s.amount)}</div>
          <button class="li-del" data-del-biaya="${s.id}">×</button>
        </div>`).join('') + '</div>';
      biayaWrap.querySelectorAll('[data-del-biaya]').forEach(b=>{
        b.addEventListener('click', async ()=>{
          const targetId = b.dataset.delBiaya;
          await fetchLatest();
          data.costLogs = data.costLogs.filter(x=>x.id!==targetId);
          await saveData(); renderStokLists();
        });
      });
    }
  }

  // ===== Rekap =====
  let rekapRange = 'today';
  document.getElementById('rekapSegmented').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-range]');
    if(!btn) return;
    document.querySelectorAll('#rekapSegmented button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    rekapRange = btn.dataset.range;
    renderRekap();
  });

  function inRange(iso){
    const t = new Date(iso);
    if(rekapRange==='all') return true;
    if(rekapRange==='today') return todayKey(t)===todayKey();
    if(rekapRange==='week'){
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-6); cutoff.setHours(0,0,0,0);
      return t >= cutoff;
    }
    return true;
  }

  function renderRekap(){
    const trans = data.transactions.filter(t=>inRange(t.time));
    const stok = data.stockLogs.filter(s=>inRange(s.time));
    const biaya = data.costLogs.filter(b=>inRange(b.time));

    const omzet = trans.reduce((a,t)=>a+t.total,0);
    const belanja = stok.reduce((a,s)=>a+s.cost,0);
    const opCost = biaya.reduce((a,b)=>a+b.amount,0);
    const laba = omzet - belanja - opCost;

    document.getElementById('rcOmzet').textContent = rupiah(omzet);
    document.getElementById('rcTrans').textContent = trans.length;
    document.getElementById('rcBelanja').textContent = rupiah(belanja);
    document.getElementById('rcBiaya').textContent = rupiah(opCost);
    const labaEl = document.getElementById('rcLaba');
    labaEl.textContent = (laba<0?'-':'') + rupiah(Math.abs(laba));
    labaEl.className = 'rc-val ' + (laba>=0?'pos':'neg');

    const tally = {};
    trans.forEach(t=>t.items.forEach(it=>{
      tally[it.name] = (tally[it.name]||0) + it.qty;
    }));
    const sorted = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
    const terlarisWrap = document.getElementById('terlarisWrap');
    if(sorted.length===0){
      terlarisWrap.innerHTML = '<div class="empty-note">Belum ada transaksi di periode ini.</div>';
    } else {
      terlarisWrap.innerHTML = sorted.map(([name,qty])=>`
        <div class="tally-row"><span>${escapeHtml(name)}</span><span class="t-count">${qty}x</span></div>
      `).join('');
    }

    const riwayatWrap = document.getElementById('riwayatWrap');
    const sortedTrans = [...trans].sort((a,b)=>b.time.localeCompare(a.time)).slice(0,30);
    if(sortedTrans.length===0){
      riwayatWrap.innerHTML = '<div class="empty-note">Belum ada riwayat transaksi.</div>';
    } else {
      riwayatWrap.innerHTML = sortedTrans.map(t=>`
        <div class="log-item">
          <div class="li-main">${t.items.map(i=>i.name+' x'+i.qty).join(', ')}<div class="li-sub">${timeStr(t.time)}</div></div>
          <div class="li-amt">${rupiah(t.total)}</div>
        </div>
      `).join('');
    }
  }

  function renderHeaderOmzet(){
    const tKey = todayKey();
    const omzet = data.transactions.filter(t=>todayKey(new Date(t.time))===tKey).reduce((a,t)=>a+t.total,0);
    document.getElementById('omzetTodayHeader').textContent = rupiah(omzet);
  }

  function timeStr(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  }

  function renderAll(){
    document.getElementById('kedaiNameText').textContent = data.settings.name;
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('id-ID',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
    renderMenuGrid();
    renderCart();
    renderHeaderOmzet();
    renderStokLists();
    renderRekap();
  }

  // Auto-refresh tiap 7 detik: ambil data terbaru dari device lain dan update tampilan.
  setInterval(async ()=>{
    if(document.hidden) return;
    const menuModalOpen = document.getElementById('modalMenu').classList.contains('open');
    await fetchLatest();
    renderReadOnly();
    if(menuModalOpen) renderMenuEditList();
  }, 7000);

  loadData();
})();
</script>
</body>
</html>
